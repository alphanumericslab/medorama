<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d">
<title id="t">Medorama: architecture at a glance</title><desc id="d">People use a browser; requests pass the institution's front door (TLS, optionally its single sign-on), then Medorama's sign-in, roles and grants, and handlers, which unwrap the data keys of the databases they read; every answer leaves through the privacy gate. Readers turn each format into one of four data models. Medorama keeps a control store with no identifiers and an encrypted workspace, and only reads the connected databases.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B97A00"/></marker></defs>
<rect x="0" y="0" width="1000" height="760" rx="14" fill="#FFFFFF"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2937">
<text x="24" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Medorama at a glance</text>
<text x="24" y="54" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">One server, one way in, one way out: sign-in and grants decide who may read what, the privacy gate decides what leaves.</text>
<rect x="24" y="80" width="220" height="76" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
<text x="36" y="101" font-size="13.5" font-weight="650" fill="#1F2937" text-anchor="start">People</text>
<text x="36" y="120.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">researchers, clinicians,</text>
<text x="36" y="136.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">data managers, admins</text>
<rect x="276" y="80" width="220" height="76" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/>
<text x="288" y="101" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Web browser</text>
<text x="288" y="120.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">the Medorama page and viewers:</text>
<text x="288" y="136.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">static pages; stores no data</text>
<rect x="528" y="80" width="448" height="76" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="540" y="101" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">The institution’s front door</text>
<text x="540" y="120.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">HTTPS (a reverse proxy), and where required its sign-in:</text>
<text x="540" y="136.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">single sign-on, MFA, VPN — the part each institution adapts</text>
<path d="M244 118 L276 118" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M496 118 L528 118" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="24" y="178" width="952" height="346" rx="12" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="36" y="196" font-size="11.5" font-weight="600" fill="#6B7280" text-anchor="start">Medorama server</text>
<rect x="40" y="206" width="218" height="80" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="52" y="227" font-size="13" font-weight="650" fill="#0B3C5D" text-anchor="start">1  Sign-in  (signin.rs)</text>
<text x="52" y="246.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">who is asking: a password,</text>
<text x="52" y="262.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">or the name the proxy sends</text>
<rect x="274" y="206" width="218" height="80" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="286" y="227" font-size="13" font-weight="650" fill="#0B3C5D" text-anchor="start">2  Roles and grants</text>
<text x="286" y="246.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">role, PHI permission (users.rs);</text>
<text x="286" y="262.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">grants per database (grants.rs)</text>
<path d="M258 246 L274 246" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="508" y="206" width="218" height="80" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="520" y="227" font-size="13" font-weight="650" fill="#0B3C5D" text-anchor="start">3  Handlers</text>
<text x="520" y="246.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">API, viewer gateway, pages:</text>
<text x="520" y="262.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">databases, cohorts, patients</text>
<path d="M492 246 L508 246" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="742" y="206" width="218" height="80" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="754" y="227" font-size="13" font-weight="650" fill="#0B3C5D" text-anchor="start">4  Data keys  (workspace.rs)</text>
<text x="754" y="246.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">a database’s key unwrapped</text>
<text x="754" y="262.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">only for a granted request</text>
<path d="M726 246 L742 246" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M752 156 L752 168 L149 168 L149 206" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="302" width="920" height="64" rx="9" fill="#FDF1DC" stroke="#B97A00" stroke-width="1.4"/>
<text x="52" y="323" font-size="13.5" font-weight="650" fill="#5C3D00" text-anchor="start">5  The privacy gate  (gate.rs, deid.rs, dicom.rs)</text>
<text x="52" y="342.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">every answer, file and export of a session in Privacy Mode leaves through it: identifiers replaced, dates moved back,</text>
<text x="52" y="358.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">files de-identified at the source; an answer it did not clear is refused (fail closed)</text>
<path d="M617 286 L617 302" fill="none" stroke="#B97A00" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="40" y="382" width="440" height="126" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="52" y="403" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Readers: one per format</text>
<text x="52" y="422.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">WFDB, EDF, ECG and DICOM files; connected databases</text>
<text x="52" y="438.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">(OMOP, SQL views, db-builder SQLite); licensed formats</text>
<text x="52" y="455.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">through add-ons</text>
<text x="52" y="471.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Past the reader, every format is one of four data models:</text>
<text x="52" y="488.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">recordings, ECGs, images, database tables</text>
<rect x="496" y="382" width="220" height="126" rx="9" fill="#E4F4EE" stroke="#009E73" stroke-width="1.4"/>
<text x="508" y="403" font-size="13.5" font-weight="650" fill="#0B4A38" text-anchor="start">VitalStream viewer</text>
<text x="508" y="422.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">waveforms; a private port</text>
<text x="508" y="438.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">on 127.0.0.1, reached only</text>
<text x="508" y="455.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">through Medorama’s</text>
<text x="508" y="471.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">gateway</text>
<rect x="732" y="382" width="228" height="126" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="744" y="403" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Jobs, plug-ins, add-ons</text>
<text x="744" y="422.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">indexing and actions;</text>
<text x="744" y="438.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">plug-ins and adapters run as</text>
<text x="744" y="455.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">separate programs and</text>
<text x="744" y="471.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">get pseudonyms, not PHI</text>
<rect x="24" y="548" width="300" height="122" rx="9" fill="#F2F3F5" stroke="#6B7280" stroke-width="1.4"/>
<text x="36" y="569" font-size="13.5" font-weight="650" fill="#1F2937" text-anchor="start">Control store</text>
<text x="36" y="588.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">SQLite or PostgreSQL: users, grants,</text>
<text x="36" y="604.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">the list of databases, wrapped keys,</text>
<text x="36" y="621.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">keyed hashes of identifiers (never</text>
<text x="36" y="637.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">identifiers), cohorts, jobs, audit</text>
<rect x="350" y="548" width="300" height="122" rx="9" fill="#F6E8F1" stroke="#A8507E" stroke-width="1.4"/>
<text x="362" y="569" font-size="13.5" font-weight="650" fill="#4A1D36" text-anchor="start">Workspace  (encrypted)</text>
<text x="362" y="588.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">one folder per database (its persons</text>
<text x="362" y="604.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">as linked, variables, recordings,</text>
<text x="362" y="621.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">results), one file per cohort; index</text>
<text x="362" y="637.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">folders are not encrypted yet</text>
<rect x="676" y="548" width="300" height="122" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="688" y="569" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Connected databases  (read only)</text>
<text x="688" y="588.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">OMOP, any SQL database through</text>
<text x="688" y="604.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">views, db-builder SQLite; the</text>
<text x="688" y="621.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">recording files they name, read</text>
<text x="688" y="637.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">where they lie</text>
<path d="M174 524 L174 548" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="184" y="540" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">read, write</text>
<path d="M500 524 L500 548" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="510" y="540" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">read, write</text>
<path d="M826 548 L826 524" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="836" y="540" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">read only</text>
<text x="24" y="700" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Numbers: a request’s path. Dashed: outside Medorama. The master key that wraps the data keys is kept outside the workspace</text>
<text x="24" y="718" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">(an environment variable, a key file, or a command: a keyring, Vault, a KMS). The server runs as one operating-system account and</text>
<text x="24" y="736" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">listens on 127.0.0.1 by default. An institution adapts its front door, and at most one module of Medorama (signin.rs).</text>
</g></svg>
