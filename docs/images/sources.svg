<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
<title id="t">Medorama: sources and the control store</title><desc id="d">The Medorama servers keep their own data in the control store (SQLite, or PostgreSQL for several servers), read the catalog of imported databases and connected databases (OMOP, mapped SQL) in place, link each source's persons to one patient in the registry, and send every answer through the privacy gate.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B97A00"/></marker></defs>
<rect x="0" y="0" width="1000" height="600" rx="14" fill="#FFFFFF"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2937">
<text x="24" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Sources and the control store</text>
<text x="24" y="54" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">One patient, one pseudonym, across every source; every answer through the same gate; connected databases only read.</text>
<rect x="24" y="84" width="952" height="46" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/>
<text x="36" y="105" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Browser, command line, plug-ins</text>
<text x="36" y="124.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">HTTPS to any server: sessions, cohorts and the job queue are in the control store</text>
<rect x="24" y="146" width="952" height="238" rx="12" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="36" y="164" font-size="11.5" font-weight="600" fill="#6B7280" text-anchor="start">Medorama server  (one with SQLite; several identical ones with PostgreSQL)</text>
<rect x="40" y="174" width="920" height="40" rx="9" fill="#FDF1DC" stroke="#B97A00" stroke-width="1.4"/>
<text x="52" y="195" font-size="12.5" font-weight="650" fill="#5C3D00" text-anchor="start">privacy gate  (gate.rs): every answer and file leaves through it; only canonical fields reach it</text>
<rect x="40" y="226" width="300" height="146" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="52" y="247" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Features</text>
<text x="52" y="266.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">cohorts (criteria across sources)</text>
<text x="52" y="282.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">the patient page (every source’s</text>
<text x="68" y="299.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">entries in the same columns)</text>
<text x="52" y="315.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">databases, exports, jobs, gateway</text>
<rect x="356" y="226" width="300" height="146" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="368" y="247" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Query layer</text>
<text x="368" y="266.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">planner (cohorts/): each criterion</text>
<text x="384" y="282.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">to each source that holds such data,</text>
<text x="384" y="299.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">its filters run there</text>
<text x="368" y="315.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">registry (sources/link.rs): persons</text>
<text x="384" y="332.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">linked to patients, by ID, then MRN</text>
<rect x="672" y="226" width="288" height="146" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="684" y="247" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Source layer</text>
<text x="684" y="266.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">the catalog: imported databases</text>
<text x="684" y="282.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">connected databases (sources/):</text>
<text x="700" y="299.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">three views of canonical columns</text>
<text x="700" y="315.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">OMOP built in; any SQL mapped</text>
<text x="684" y="332.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">sql/: SQLite or PostgreSQL, one API</text>
<rect x="24" y="408" width="300" height="168" rx="9" fill="#F6E8F1" stroke="#A8507E" stroke-width="1.4"/>
<text x="36" y="429" font-size="13.5" font-weight="650" fill="#4A1D36" text-anchor="start">Control store</text>
<text x="36" y="448.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">SQLite (one server) or PostgreSQL</text>
<text x="36" y="464.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">users, sessions, audit, settings</text>
<text x="36" y="481.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">the catalog’s imported databases</text>
<text x="36" y="497.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">patients, identifiers (PHI),</text>
<text x="52" y="514.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">pseudonyms, the registry</text>
<text x="36" y="530.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">cohorts and their sources’ versions</text>
<text x="36" y="547.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">the job queue (advisory locks)</text>
<rect x="350" y="408" width="300" height="168" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="362" y="429" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Connected databases (read only)</text>
<text x="362" y="448.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">OMOP CDM 5.3, 5.4 · mapped SQL</text>
<text x="362" y="464.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">PostgreSQL: on-site, Amazon RDS</text>
<text x="378" y="481.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">and Aurora, Azure; SQLite files</text>
<text x="362" y="497.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">read-only sessions; TLS required</text>
<text x="378" y="514.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">to another host, verified</text>
<text x="362" y="530.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">per-query time limit, row limit</text>
<text x="362" y="547.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">password in a file, never stored</text>
<rect x="676" y="408" width="300" height="168" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="688" y="429" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Files (read only)</text>
<text x="688" y="448.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">recordings (WFDB; others by add-ons)</text>
<text x="688" y="464.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">ECGs (WFDB, MUSE XML, DICOM)</text>
<text x="688" y="481.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">DICOM studies, pictures, PDFs</text>
<text x="688" y="497.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">inside data_roots, linked by the</text>
<text x="704" y="514.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">rows that name their patient</text>
<path d="M174 384 L174 408" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="184" y="400" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">read, write</text>
<path d="M500 384 L500 408" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="510" y="400" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">read only</text>
<path d="M826 384 L826 408" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="836" y="400" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">read only</text>
<path d="M500 130 L500 146" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
</g></svg>
