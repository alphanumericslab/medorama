<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
<title id="t">Medorama: connected databases, the control store and the workspace</title><desc id="d">Medorama reads each connected database in place. The patient index links each database's persons to patients by exact (issuer, identifier) pairs. The control store keeps patient numbers, pseudonyms and keyed hashes of the pairs, never identifiers; each database's persons as linked, its variables and recordings are kept in its own folder of the workspace, encrypted with its data key, which the master key wraps.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B97A00"/></marker></defs>
<rect x="0" y="0" width="1000" height="640" rx="14" fill="#FFFFFF"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2937">
<text x="24" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Connected databases, the control store and the workspace</text>
<text x="24" y="54" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">One patient, one pseudonym, across every database; identifiers only in the databases and the encrypted workspace.</text>
<rect x="24" y="80" width="296" height="64" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="36" y="101" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">An OMOP database</text>
<text x="36" y="120.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">views built into Medorama; only read</text>
<rect x="352" y="80" width="296" height="64" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="364" y="101" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">A db-builder database</text>
<text x="364" y="120.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">its tables are the views; only read</text>
<rect x="680" y="80" width="296" height="64" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="692" y="101" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Any SQL database</text>
<text x="692" y="120.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">views written by the site; only read</text>
<rect x="24" y="164" width="952" height="172" rx="12" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="36" y="182" font-size="11.5" font-weight="600" fill="#6B7280" text-anchor="start">Medorama server</text>
<path d="M172 144 L172 196" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M500 144 L500 196" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M828 144 L828 154 L600 154 L600 196" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="196" width="580" height="124" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="52" y="217" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Patient index  (persons.rs)</text>
<text x="52" y="236.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">each person’s pairs: the patient ID under its issuer (patient_id_issuer, or the</text>
<text x="68" y="252.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">database’s issuer setting, else the database itself), the MRN under mrn:&lt;authority&gt;</text>
<text x="52" y="269.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">a pair equal in two databases: one patient, one pseudonym (exact joins only)</text>
<text x="52" y="285.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">pairs that name two patients: a conflict, listed, never linked or merged</text>
<rect x="636" y="196" width="324" height="124" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="648" y="217" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Keys  (workspace.rs)</text>
<text x="648" y="236.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">a data key per database and per</text>
<text x="648" y="252.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">cohort, wrapped by the master key</text>
<text x="648" y="269.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">(AES-256-GCM); unwrapped only for</text>
<text x="648" y="285.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">a request whose user holds a grant</text>
<rect x="24" y="384" width="300" height="184" rx="9" fill="#F2F3F5" stroke="#6B7280" stroke-width="1.4"/>
<text x="36" y="405" font-size="13.5" font-weight="650" fill="#1F2937" text-anchor="start">Control store</text>
<text x="36" y="424.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">SQLite (one server) or PostgreSQL</text>
<text x="36" y="440.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">patients: number, MO- pseudonym;</text>
<text x="52" y="457.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">no identifier</text>
<text x="36" y="473.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">patient_keys: a keyed hash of each</text>
<text x="52" y="490.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">pair, and its patient</text>
<text x="36" y="506.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">databases, grants, wrapped keys,</text>
<text x="36" y="523.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">cohort definitions, jobs, audit</text>
<rect x="356" y="384" width="400" height="184" rx="9" fill="#F6E8F1" stroke="#A8507E" stroke-width="1.4"/>
<text x="368" y="405" font-size="13.5" font-weight="650" fill="#4A1D36" text-anchor="start">Workspace  (encrypted, SQLCipher)</text>
<text x="368" y="424.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">db-0001/   one folder per connected database</text>
<text x="384" y="440.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">persons.sqlite: identifiers, names, birth date, sex</text>
<text x="384" y="457.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">variables.sqlite, recordings.sqlite</text>
<text x="384" y="473.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">results-&lt;action&gt;.sqlite</text>
<text x="368" y="490.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">cohorts/c-0001.sqlite: members, provenance</text>
<text x="368" y="506.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">each file with its owner’s data key</text>
<text x="368" y="523.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">index/: index format 2, not encrypted yet</text>
<rect x="788" y="384" width="188" height="184" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="800" y="405" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Master key</text>
<text x="800" y="424.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">outside the workspace:</text>
<text x="800" y="440.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">$MEDORAMA_MASTER_KEY,</text>
<text x="800" y="457.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">master_key_command</text>
<text x="800" y="473.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">(keyring, Vault, KMS),</text>
<text x="800" y="490.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">or master_key_file</text>
<path d="M172 320 L172 384" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="182" y="356" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">keyed hashes, pseudonyms</text>
<path d="M500 320 L500 384" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="510" y="356" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">identifiers, as linked</text>
<path d="M700 320 L700 384" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="694" y="356" font-size="11" font-weight="400" fill="#4B5563" text-anchor="end">opens</text>
<path d="M882 384 L882 320" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="892" y="356" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">wraps</text>
<text x="24" y="598" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Removing a database destroys its data key, deletes its workspace folder, its keyed hashes and every cohort member it put there.</text>
<text x="24" y="616" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">The database itself is never touched. Design: docs/design/databases-only.md and docs/design/sources.md.</text>
</g></svg>
