<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
<title id="t">Sign-in: one seam</title><desc id="d">Users sign in either with Medorama's own accounts and passwords, or through the institution's authenticating proxy, which names the user in a header. Both end in one function, signin.rs identify, which gives every handler the signed-in user; roles, the PHI permission and Privacy Mode are decided in Medorama either way.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B97A00"/></marker></defs>
<rect x="0" y="0" width="1000" height="440" rx="14" fill="#FFFFFF"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2937">
<text x="24" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">Sign-in: one seam</text>
<text x="24" y="54" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">How a user signs in is decided in one module; who may see what is decided by Medorama, the same for every method.</text>
<rect x="24" y="140" width="170" height="92" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/>
<text x="36" y="161" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Web browser</text>
<text x="36" y="180.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">the Medorama page</text>
<rect x="236" y="80" width="330" height="98" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="248" y="101" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">sign_in = "password"  (the default)</text>
<text x="248" y="120.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">POST login: name and password</text>
<text x="248" y="136.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">(Argon2id, throttled, audited);</text>
<text x="248" y="153.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">a session cookie (HttpOnly, SameSite)</text>
<rect x="236" y="196" width="330" height="128" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="248" y="217" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">sign_in = "proxy": the institution’s sign-in</text>
<text x="248" y="236.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">a reverse proxy in front of Medorama signs the</text>
<text x="248" y="252.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">user in: SAML (Shibboleth), OpenID Connect</text>
<text x="248" y="269.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">(Azure AD, Okta, Google), Kerberos, MFA, VPN;</text>
<text x="248" y="285.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">it sets X-Remote-User to the user’s name</text>
<rect x="608" y="140" width="170" height="92" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="620" y="161" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">signin.rs</text>
<text x="620" y="180.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">identify(): the one</text>
<text x="620" y="196.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">function that knows</text>
<text x="620" y="213.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">how users sign in</text>
<rect x="820" y="120" width="156" height="132" rx="9" fill="#FDF1DC" stroke="#B97A00" stroke-width="1.4"/>
<text x="832" y="141" font-size="13.5" font-weight="650" fill="#5C3D00" text-anchor="start">Every handler</text>
<text x="832" y="160.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">gets Auth(User);</text>
<text x="832" y="176.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">roles, PHI</text>
<text x="832" y="193.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">permission and</text>
<text x="832" y="209.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Privacy Mode</text>
<text x="832" y="226.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">decided by Medorama</text>
<path d="M194 170 L236 130" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M194 202 L236 260" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M566 130 L608 170" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M566 260 L608 202" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="618" y="256" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">its header is believed only</text>
<text x="618" y="270" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">from proxy_addresses</text>
<path d="M778 186 L820 186" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="346" width="952" height="74" rx="9" fill="#F2F3F5" stroke="#6B7280" stroke-width="1.4"/>
<text x="36" y="367" font-size="13.5" font-weight="650" fill="#1F2937" text-anchor="start">Adapting it</text>
<text x="36" y="386.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Most institutions need no code: put their sign-in proxy in front and set sign_in = "proxy" (docs/sign-in.md). Another method is a new</text>
<text x="36" y="402.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">variant of signin.rs Method and its arm in identify(); no other file changes. Accounts, roles and the PHI permission stay in Medorama.</text>
</g></svg>
