<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-labelledby="t d">
<title id="t">Medorama: system context and trust boundaries</title><desc id="d">People use a browser; the browser reaches the Medorama server over TLS or an SSH tunnel; the server reads the data sources, keeps the catalog database, runs the VitalStream viewer and plug-ins on the same host.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B97A00"/></marker></defs>
<rect x="0" y="0" width="1000" height="610" rx="14" fill="#FFFFFF"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2937">
<text x="24" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start">System context and trust boundaries</text>
<text x="24" y="54" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Every request crosses one boundary into the server, where sign-in, roles and the privacy gate decide what leaves.</text>
<rect x="24" y="90" width="170" height="58" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
<text x="36" y="111" font-size="13.5" font-weight="650" fill="#1F2937" text-anchor="start">Researcher</text>
<text x="36" y="130.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">cohorts, data, viewers</text>
<rect x="24" y="164" width="170" height="58" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
<text x="36" y="185" font-size="13.5" font-weight="650" fill="#1F2937" text-anchor="start">Clinician</text>
<text x="36" y="204.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">a patient’s journey</text>
<rect x="24" y="238" width="170" height="58" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
<text x="36" y="259" font-size="13.5" font-weight="650" fill="#1F2937" text-anchor="start">Data manager (admin)</text>
<text x="36" y="278.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">imports, users, review</text>
<rect x="214" y="76" width="220" height="240" rx="12" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="226" y="94" font-size="11.5" font-weight="600" fill="#6B7280" text-anchor="start">User’s computer (untrusted)</text>
<rect x="228" y="104" width="192" height="190" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/>
<text x="240" y="125" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Web browser</text>
<text x="240" y="144.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Medorama page</text>
<text x="240" y="160.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">ECG, PACS, VitalStream</text>
<text x="240" y="177.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">viewers (static pages)</text>
<text x="240" y="193.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="240" y="210.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">stores nothing; shows</text>
<text x="240" y="226.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">what the server sends</text>
<path d="M194 119 L228 119" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M194 193 L228 193" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M194 267 L228 267" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M420 200 L548 200" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="484" y="166" font-size="11" font-weight="400" fill="#4B5563" text-anchor="middle">HTTPS through</text>
<text x="484" y="180" font-size="11" font-weight="400" fill="#4B5563" text-anchor="middle">a reverse proxy,</text>
<text x="484" y="194" font-size="11" font-weight="400" fill="#4B5563" text-anchor="middle">or an SSH tunnel</text>
<rect x="540" y="76" width="440" height="496" rx="12" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="552" y="94" font-size="11.5" font-weight="600" fill="#6B7280" text-anchor="start">Server host (trusted; the catalog’s OS account)</text>
<rect x="556" y="104" width="408" height="150" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="568" y="125" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Medorama server  (127.0.0.1:8090 by default)</text>
<text x="568" y="144.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">sign-in (Argon2id), sessions, roles, PHI permission</text>
<text x="568" y="160.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">API, patient pages, cohorts, databases, imports</text>
<text x="568" y="177.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">privacy gate: Privacy Mode answers, files, exports</text>
<text x="568" y="193.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">audit log, job queue and workers</text>
<rect x="556" y="270" width="196" height="110" rx="9" fill="#E4F4EE" stroke="#009E73" stroke-width="1.4"/>
<text x="568" y="291" font-size="13.5" font-weight="650" fill="#0B4A38" text-anchor="start">VitalStream viewer</text>
<text x="568" y="310.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">127.0.0.1, private port,</text>
<text x="568" y="326.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">reached only through</text>
<text x="568" y="343.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Medorama’s gateway;</text>
<text x="568" y="359.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">add-ons read other formats</text>
<rect x="768" y="270" width="196" height="110" rx="9" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="780" y="291" font-size="13.5" font-weight="650" fill="#0B3C5D" text-anchor="start">Plug-in actions</text>
<text x="780" y="310.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">separate processes</text>
<text x="780" y="326.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">own process group,</text>
<text x="780" y="343.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">timeout; get pseudonyms</text>
<text x="780" y="359.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">and file paths only</text>
<path d="M654 254 L654 270" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M866 254 L866 270" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="556" y="398" width="196" height="162" rx="9" fill="#F6E8F1" stroke="#A8507E" stroke-width="1.4"/>
<text x="568" y="419" font-size="13.5" font-weight="650" fill="#4A1D36" text-anchor="start">Catalog database</text>
<text x="568" y="438.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">SQLite (owner-only, optional</text>
<text x="568" y="454.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">SQLCipher), or PostgreSQL</text>
<text x="568" y="471.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">(TLS, verified)</text>
<text x="568" y="487.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">identifiers (PHI) in their</text>
<text x="568" y="504.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">own tables; pseudonyms;</text>
<text x="568" y="520.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">users, jobs, audit log</text>
<rect x="768" y="398" width="196" height="74" rx="9" fill="#F2F3F5" stroke="#6B7280" stroke-width="1.4"/>
<text x="780" y="419" font-size="13.5" font-weight="650" fill="#1F2937" text-anchor="start">Index and results folders</text>
<text x="780" y="438.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">derived data, pseudonymous</text>
<rect x="768" y="486" width="196" height="74" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="780" y="507" font-size="13.5" font-weight="650" fill="#374151" text-anchor="start">Data sources (read only)</text>
<text x="780" y="526.0" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">exports, recordings, ECGs,</text>
<text x="780" y="542.5" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">DICOM; connected databases</text>
<path d="M556 236 L547 236 L547 470 L556 470" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M866 380 L866 398" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<text x="760" y="592" font-size="11" font-weight="400" fill="#4B5563" text-anchor="middle">The server, the viewer and the plug-ins read the data sources; nothing writes to them.</text>
<text x="24" y="330" font-size="13" font-weight="650" fill="#1F2937" text-anchor="start">Inputs</text>
<text x="24" y="352" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Databases (CSV, Excel) imported by an admin,</text>
<text x="24" y="369" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">or connected and read in place (OMOP, SQL).</text>
<text x="24" y="386" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Files enter only with the rows that name their</text>
<text x="24" y="403" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">patient, read where they are; never written.</text>
<text x="24" y="450" font-size="13" font-weight="650" fill="#1F2937" text-anchor="start">Outputs to people</text>
<text x="24" y="472" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Identified: users with the PHI permission,</text>
<text x="24" y="489" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Privacy Mode off.  Privacy Mode (default for</text>
<text x="24" y="506" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">everyone but admins): pseudonyms, placeholders,</text>
<text x="24" y="523" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">dates moved back; files de-identified or marked.</text>
</g></svg>
