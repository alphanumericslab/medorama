# Release: on a version tag (v*), test the workspace and check its dependencies, build the programs
# for Linux, macOS and Windows (Medorama and vitalstream-rs from the Rust workspace; vitalstream-cpp
# from the C++ project), and attach them to a draft GitHub release with their SHA-256 sums
# (SHA256SUMS) and a signed build provenance (an attestation).  Every archive carries LICENSE,
# COMMERCIAL.md, THIRD_PARTY_LICENSES.md and the license of the WFDB library it contains (wfdb-x's
# LICENSE, the GPL v3, from the pinned checkout); the Rust archives also carry
# THIRD_PARTY_CRATES.txt, the licences of the crates compiled in (cargo about, tools/about.toml).
# The Linux "musl" archives are fully static: they run on any Linux, including older servers whose
# C library is older than the build machine's.  Licensed add-ons (adapters) are released from
# their own repositories.
#
# Binary releases are off until the repository variable RELEASES_ENABLED is "true" (Settings >
# Secrets and variables > Actions > Variables): the programs contain wfdb-x (GPL v3), and how they
# may be distributed is not settled yet (THIRD_PARTY_LICENSES.md).  Until then a tag runs nothing.
#
# The archives are reproducible: a pinned Rust (RELEASE_RUST), the build paths remapped, and the
# entries in a fixed order with the tagged commit's time (tools/release-archive.py).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # the Rust that builds the release (docs/developing.md, "Releases"); CI tests the current stable
  # and the oldest supported one (rust-version in Cargo.toml)
  RELEASE_RUST: "1.99.1"

jobs:
  checks:
    # the tests and the dependencies' checks of the tagged commit, before anything is packaged
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0: for the plug-in test
        with:
          python-version: "3.12"
      - name: A viewer for the gateway's contract test
        run: cargo build --release --locked -p vitalstream-rs
      - name: Tests of the workspace
        run: cargo test --release --locked --workspace
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources bans

  binaries:
    needs: checks
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0: tools/release-archive.py
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: |
          # no build machine's paths in the programs: the clone and cargo's home under fixed names
          ws=$(pwd) home=${CARGO_HOME:-$HOME/.cargo}
          if command -v cygpath > /dev/null; then ws=$(cygpath -w "$ws") home=$(cygpath -w "$home"); fi
          export RUSTFLAGS="--remap-path-prefix=$ws=/build --remap-path-prefix=$home=/cargo"
          cargo build --release --locked --target ${{ matrix.target }} -p medorama -p vitalstream-rs
      - name: Package
        run: |
          name=medorama-${{ github.ref_name }}-${{ matrix.target }}
          ext=$([[ "${{ matrix.target }}" == *windows* ]] && echo .exe || true)
          mkdir "$name"
          for b in medorama vitalstream-rs; do cp "target/${{ matrix.target }}/release/$b$ext" "$name"/; done
          cp README.md LICENSE COMMERCIAL.md THIRD_PARTY_LICENSES.md PRIVACY.md SECURITY.md "$name"/
          # wfdb-x's library license, from cargo's checkout of the commit Cargo.lock pins
          cargo metadata --format-version 1 --locked | python -c 'import json, pathlib, sys
          p = next(p for p in json.load(sys.stdin)["packages"] if p["name"] == "wfdbx")
          d = pathlib.Path(p["manifest_path"]).parent
          sys.stdout.buffer.write(next(x / "LICENSE" for x in [d, *list(d.parents)[:2]] if (x / "LICENSE").is_file()).read_bytes())' > "$name"/LICENSE-wfdb-x
          # the licences of the crates compiled in
          cargo about generate --locked -c tools/about.toml tools/about.hbs -o "$name"/THIRD_PARTY_CRATES.txt
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct); export SOURCE_DATE_EPOCH
          if [ -n "$ext" ]; then python tools/release-archive.py "$name.zip" "$name"; else python tools/release-archive.py "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  cpp-binaries:
    needs: checks
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, name: x86_64-linux }
          - { os: ubuntu-22.04-arm, name: aarch64-linux }
          - { os: macos-latest, name: aarch64-macos }
          - { os: macos-15-intel, name: x86_64-macos }
          - { os: windows-latest, name: x86_64-windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Build, with the unit tests
        run: |
          python -m pip install "cmake>=3.24" ninja
          extra=()
          # Linux: the C++ runtime linked in, so the program runs on systems with an older libstdc++
          if [[ "$RUNNER_OS" == Linux ]]; then extra=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"); fi
          cd viewers/vitalstream/cpp && cmake --preset release "${extra[@]}" && cmake --build --preset release
      - name: Unit tests (ctest)
        run: cd viewers/vitalstream/cpp && ctest --preset release
      - name: Package
        run: |
          name=vitalstream-cpp-${{ github.ref_name }}-${{ matrix.name }}
          ext=$([[ "$RUNNER_OS" == Windows ]] && echo .exe || true)
          mkdir "$name"
          cp "viewers/vitalstream/cpp/build/release/bin/vitalstream-cpp$ext" "$name"/
          cp viewers/vitalstream/README.md LICENSE COMMERCIAL.md THIRD_PARTY_LICENSES.md "$name"/
          # wfdb-x's library license, from CMake's checkout of the pinned commit
          cp viewers/vitalstream/cpp/build/release/_deps/wfdbx-src/LICENSE "$name"/LICENSE-wfdb-x
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct); export SOURCE_DATE_EPOCH
          if [ -n "$ext" ]; then python tools/release-archive.py "$name.zip" "$name"; else python tools/release-archive.py "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpp-bin-${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: [checks, binaries, cpp-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # the draft release
      id-token: write        # the provenance's signature
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA-256 sums
        run: cd artifacts && sha256sum -- *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: artifacts/*
