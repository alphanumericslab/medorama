# The website (https://medorama.org/): Jekyll builds the READMEs and the
# documents into pages (_config.yml), with the live ECG and PACS viewers, on every push to main
# that changes them. Settings > Pages > Source: GitHub Actions; Custom domain: medorama.org
# (url and baseurl in _config.yml), with the domain's DNS pointing at GitHub Pages.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "_config.yml"
      - "_layouts/**"
      - "_includes/**"
      - "assets/**"
      - "docs/**"
      - "viewers/ecg/**"
      - "viewers/pacs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write           # the deployment
      id-token: write        # proves the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
