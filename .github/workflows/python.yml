# The Python packages: the Python viewer (vitalstream-py) and the database tools (muse-py,
# dicom-py), installed and tested on Linux, macOS and Windows, with the oldest and a current
# Python supported, the viewer also without its [wfdb] extra (no wfdb-x: WFDB records refused);
# and built as users get them (an sdist, a wheel from it, in a clean
# environment).  muse-py and dicom-py carry the ECG and PACS viewers' pages (viewers/ecg/,
# viewers/pacs/), and every package the licence.
name: python

on:
  push:
    paths: ["viewers/vitalstream/python/**", "viewers/vitalstream/testdata/**", "viewers/vitalstream/web/**", "viewers/ecg/**",
            "viewers/pacs/**", "libs/engine/tests/fake_adapter.py", "LICENSE", "COMMERCIAL.md", ".github/workflows/python.yml"]
  pull_request:
    paths: ["viewers/vitalstream/python/**", "viewers/vitalstream/testdata/**", "viewers/vitalstream/web/**", "viewers/ecg/**",
            "viewers/pacs/**", "libs/engine/tests/fake_adapter.py", "LICENSE", "COMMERCIAL.md", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        # Python 3.9, the oldest supported, is not built for Ubuntu 26.04 (ubuntu-latest since
        # October 2026): it is tested on Ubuntu 24.04
        exclude:
          - { os: ubuntu-latest, python: "3.9" }
        include:
          - { os: ubuntu-24.04, python: "3.9" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash          # Git Bash on Windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./viewers/vitalstream/python/vitalstream[test,wfdb]" -e ./viewers/ecg/python/muse -e ./viewers/pacs/python/dicom --config-settings editable_mode=compat
      - name: Test
        run: python -m pytest -q viewers/vitalstream/python/vitalstream/tests viewers/ecg/python/muse/tests viewers/pacs/python/dicom/tests
      - name: Command-line entry points
        run: |
          vitalstream-py --help > /dev/null
          muse-py --help > /dev/null
          dicom-py --help > /dev/null

  nowfdb:
    # the Python viewer installed without its [wfdb] extra: no wfdb-x; the tests on WFDB records
    # are skipped, test_no_wfdb.py checks the refusal, and EDF files are read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash          # Git Bash on Windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install, without the [wfdb] extra
        run: |
          python -m pip install --upgrade pip
          pip install -e "./viewers/vitalstream/python/vitalstream[test]" --config-settings editable_mode=compat
          if python -c 'import wfdbx'; then exit 1; fi
      - name: Test
        run: python -m pytest -q viewers/vitalstream/python/vitalstream/tests

  packages:
    # the packages as users get them: an sdist of each, and a wheel built from that sdist alone
    # (it carries the page and the licence), installed in a clean environment; the programs
    # start, and vitalstream-py serves the page from the wheel
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    # Python 3.9 on Ubuntu 24.04, as in `test`
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: The sdists, and the wheels built from them
        run: |
          python -m pip install build
          for p in viewers/vitalstream/python/vitalstream viewers/ecg/python/muse viewers/pacs/python/dicom; do
            python -m build --outdir "$RUNNER_TEMP/dist" "$p"
          done
      - name: Every wheel carries the licence (with its Required Notice) and its page
        run: |
          for w in "$RUNNER_TEMP"/dist/*.whl; do
            unzip -p "$w" '*.dist-info/licenses/LICENSE' | grep -q '^Required Notice:'
            unzip -Z1 "$w" | grep -q '\.dist-info/licenses/COMMERCIAL\.md$'
          done
          unzip -Z1 "$RUNNER_TEMP"/dist/vitalstream_py-*.whl | grep -q '^vitalstream_py/static/index\.html$'
          unzip -Z1 "$RUNNER_TEMP"/dist/muse_reader_py-*.whl | grep -q '^muse_reader_py/page/index\.html$'
          unzip -Z1 "$RUNNER_TEMP"/dist/dicom_index_py-*.whl | grep -q '^dicom_index_py/page/index\.html$'
      - name: Installed in a clean environment, the programs run
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          bin="$RUNNER_TEMP/clean/bin"
          "$bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          "$bin/vitalstream-py" --help > /dev/null
          "$bin/muse-py" --help > /dev/null
          "$bin/dicom-py" --help > /dev/null
          # vitalstream-py serves the page the wheel carries (started outside the clone)
          port=$("$bin/python" -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")
          (cd "$RUNNER_TEMP" && HOME="$RUNNER_TEMP/home" exec "$bin/vitalstream-py" --no-browser --no-auth --port "$port" --cache-dir "$RUNNER_TEMP/cache") &
          pid=$!
          for _ in $(seq 60); do
            curl -fs -o "$RUNNER_TEMP/app.js" "http://127.0.0.1:$port/static/js/app.js" && break
            sleep 1
          done
          kill "$pid"
          cmp "$RUNNER_TEMP/app.js" viewers/vitalstream/web/js/app.js
