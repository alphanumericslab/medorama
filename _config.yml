# The website of Medorama (https://medorama.org/): the README of each folder
# is its page, built with Jekyll by .github/workflows/pages.yml (Settings > Pages > Source:
# GitHub Actions). The ECG and PACS viewers run live on it (viewers/ecg/, viewers/pacs/): they
# are pages that read the files a visitor picks in the browser, which never leave the computer.

title: Medorama
description: >-
  A unified patient-journey research platform linking EHR data, physiological waveforms,
  imaging and laboratory results across databases.
url: https://medorama.org
baseurl: ""
repository: alphanumericslab/medorama
theme: jekyll-theme-minimal

plugins:
  - jekyll-seo-tag                # {% seo %} in _layouts/default.html
  - jekyll-readme-index           # a folder's README.md is its page
  - jekyll-relative-links         # links such as docs/security.md keep working
  - jekyll-optional-front-matter  # Markdown files need no front matter
  - jekyll-titles-from-headings   # page titles come from the first heading

# Publish each Markdown file as its page only, not also as itself.
optional_front_matter:
  remove_originals: true
readme_index:
  remove_originals: true

# Tabs above every page (_layouts/default.html). `url` is where a tab leads; `match` (default:
# url) is the URL prefix of its pages, and `also` lists further prefixes that belong to it. A
# page belongs to the tab whose prefix is the longest one that starts the page's URL
# (/docs/security.html: Security, /docs/api.html: Documentation, /libs/engine/: Documentation);
# any other page belongs to Overview. A tab with `sub` shows a second row of tabs on its pages,
# chosen the same way. The ECG and PACS sub-tabs lead to their READMEs (website.md in each
# folder), since each folder's own page is the viewer itself.
tabs:
  - { title: Overview,      url: / }
  - { title: Install,       url: /docs/install.html }
  - { title: Get started,   url: /docs/getting-started.html }
  - { title: Medorama,      url: /medorama/ }
  - title: Viewers
    url: /viewers/
    sub:
      - { title: All viewers, url: /viewers/ }
      - { title: VitalStream, url: /viewers/vitalstream/ }
      - { title: ECG,         url: /viewers/ecg/README.html, match: /viewers/ecg/ }
      - { title: PACS,        url: /viewers/pacs/README.html, match: /viewers/pacs/ }
  - title: Security
    url: /docs/security.html
    also: [/docs/protecting-patient-data.html, /docs/sign-in.html, /PRIVACY.html, /SECURITY.html]
  - title: Documentation
    url: /docs/
    also: [/libs/, /tools/, /THIRD_PARTY_LICENSES.html, /COMMERCIAL.html, /CLA.html]
  - { title: Manual,        url: /docs/user-manual/ }

# Publish the documentation and the two live viewers, not the sources, build outputs, tests and
# local data. Links from a page to a file that is not published lead to it on GitHub
# (_layouts/default.html).
