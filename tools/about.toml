# cargo about: the licences of the Rust crates compiled into the released programs
# (.github/workflows/release.yml writes THIRD_PARTY_CRATES.txt with tools/about.hbs).  The
# licences accepted are deny.toml's; Medorama's own crates (publish = false) are left out, as
# LICENSE covers them.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0",
    "Unlicense", "BSL-1.0", "CC0-1.0",
    # wfdb-x: its crate is "LGPL-2.1-or-later AND GPL-3.0-or-later" (the library and its tools); the
    # programs contain the library only (THIRD_PARTY_LICENSES.md)
    "LGPL-2.1-or-later", "GPL-3.0-or-later",
]
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
