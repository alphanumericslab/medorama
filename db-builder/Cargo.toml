# db-builder: turns tables (CSV, spreadsheets, Parquet), known exports (GE MUSE ECG metadata,
# CLIF, a site's export described in TOML) and folders of recordings into one open SQLite
# database (db-builder/docs/schema.md).  It does not depend on Medorama, and its databases do
# not either.
[package]
name = "db-builder"
version = "0.2.1"
description = "db-builder: tables, known exports and folders of recordings made into one open SQLite database"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "db_builder"
path = "src/lib.rs"

[[bin]]
name = "db-builder"
path = "src/main.rs"

[features]
default = ["wfdb"]
# WFDB records (the engine's `wfdb` feature, with wfdb-x).  Without it (`--no-default-features`)
# a WFDB record is still listed by its header, without its start and end.
wfdb = ["recording-engine/wfdb"]

[dependencies]
recording-engine.workspace = true
signal-core.workspace = true
anyhow = "1"
# the web interface (`db-builder serve`): as Medorama's
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
getrandom = "0.3"
include_dir = "0.7"
mime_guess = "2"
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
bytes = "1"
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
regex = "1"
parquet = { version = "60.0.0", default-features = false, features = ["snap", "zstd", "lz4", "flate2", "flate2-rust_backend"] }
# SQLCipher, for `--encrypt` (OpenSSL built from source: needs Perl and a C compiler)
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
# the web interface's tests (as Medorama's)
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# a spreadsheet written in the tests (calamine already depends on it)
zip = { version = "9", default-features = false, features = ["deflate"] }
