# cargo deny check: licences, advisories, sources, bans, for the whole workspace (CI: .github/workflows/rust.yml).
# The licences allowed are those THIRD_PARTY_LICENSES.md lists; anything else fails the build
# until it is reviewed and added there.

[graph]
all-features = true

[advisories]
# every RustSec advisory fails the build (vulnerabilities, unmaintained, yanked)
yanked = "deny"

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0",
    "Unlicense", "BSL-1.0",
    "CC0-1.0",  # public domain (tiny-keccak, through parquet)
]
confidence-threshold = 0.9
# wfdb-x (crate wfdbx): a separate project under the GPL v3 or later (THIRD_PARTY_LICENSES.md).
# Medorama's own crates: the PolyForm Noncommercial License 1.0.0 (LICENSE).
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "wfdbx" },
    { allow = ["PolyForm-Noncommercial-1.0.0"], crate = "medorama" },
    { allow = ["PolyForm-Noncommercial-1.0.0"], crate = "recording-engine" },
    { allow = ["PolyForm-Noncommercial-1.0.0"], crate = "signal-core" },
    { allow = ["PolyForm-Noncommercial-1.0.0"], crate = "vitalstream-rs" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# wfdb-x, pinned to a commit in Cargo.toml
allow-git = ["https://github.com/alphanumericslab/wfdb-x"]
