# Medorama: a unified patient-journey research platform linking EHR data, physiological
# waveforms, imaging and laboratory results across databases, over its catalog (a database
# of patients, encounters, EHR items and recordings), with cohorts, imports, a privacy gate, a
# background job queue, a command-line tool and a web interface (docs/architecture.md).
[package]
name = "medorama"
version = "0.1.0"
description = "Medorama: patients, encounters, EHR data, recordings and images from many databases, on one page, for research"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "medorama"
path = "src/lib.rs"

[[bin]]
name = "medorama"
path = "src/main.rs"

[features]
default = ["wfdb"]
# WFDB records and folders (the engine's `wfdb` feature, with wfdb-x).  Without it
# (`--no-default-features`) Medorama holds no wfdb-x code: adding or opening a WFDB recording is
# refused ("this build has no WFDB support"); every other format works as usual.
wfdb = ["recording-engine/wfdb"]
# Encrypt the database file (SQLCipher, with OpenSSL built from source: needs Perl and a C
# compiler).  The key comes from the environment variable MEDORAMA_KEY or the
# settings key `key_file`.
encryption = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
recording-engine.workspace = true
signal-core.workspace = true
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
getrandom = "0.3"
hmac = "0.13"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
include_dir = "0.7"
mime_guess = "2"
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "io-util", "fs"] }
futures-util = { version = "0.3", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
calamine = { version = "0.38", features = ["dates"] }
tokio-postgres-rustls = "0.14"
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
bytes = "1"
tokio-postgres = "0.7"
parquet = { version = "60.0.0", default-features = false, features = ["snap", "zstd", "lz4", "flate2", "flate2-rust_backend"] }

[dev-dependencies]
tempfile = "3"
# a spreadsheet written in the tests (calamine already depends on it)
zip = { version = "9", default-features = false, features = ["deflate"] }
tower = { version = "0.5", features = ["util"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
